# Render "Blueprint" (this file sits at the top of the repo): Render reads it and sets up the server (see backend/DEPLOY.md).
# Values marked sync: false are secrets - Render asks you to type them in; they never go in git.
services:
  - type: web
    name: gakupres-backend
    runtime: node
    rootDir: backend         # the server is in the backend/ folder of the repo
    region: singapore        # closest to the Philippines
    plan: free               # sleeps after 15 min without use (keep it awake with a free ping, see backend/DEPLOY.md)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LATE_AFTER_MINUTES
        value: "15"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # email (sign-up codes, password resets, feedback) goes through Brevo: the free plan blocks Gmail's SMTP ports
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false          # e.g. GakuPres <gakupres@gmail.com>  (verified as a sender in Brevo)
      - key: FEEDBACK_TO
        sync: false          # where feedback goes, e.g. gakupres@gmail.com
